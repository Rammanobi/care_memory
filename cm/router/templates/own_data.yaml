    tier: green
    doctor_approved: true
    placeholders: []
    languages:
      en:
        telegram: "No refill is recorded yet."
        email:
          subject: "Your record"
          body: "No refill is recorded yet."
      te:
        # needs native-speaker review
        telegram: "ఇంకా ఏ రీఫిల్ నమోదు కాలేదు."
        email:
          subject: "మీ రికార్డు"
          body: "ఇంకా ఏ రీఫిల్ నమోదు కాలేదు."

  - id: own_data_none_v1
    kind: own_data_none_v1
    audience: patient
    tier: green
    doctor_approved: true
    placeholders: []
    languages:
      en:
        telegram: "There is not enough history yet. Keep sending your daily check-in."
        email:
          subject: "Your record"
          body: "There is not enough history yet. Keep sending your daily check-in."
      te:
        # needs native-speaker review
        telegram: "ఇంకా తగినంత చరిత్ర లేదు. మీ రోజువారీ చెక్-ఇన్ పంపుతూ ఉండండి."
        email:
          subject: "మీ రికార్డు"
          body: "ఇంకా తగినంత చరిత్ర లేదు. మీ రోజువారీ చెక్-ఇన్ పంపుతూ ఉండండి."

  - id: own_data_advice_v1
    kind: own_data_advice_v1
    audience: patient
    tier: green
    doctor_approved: true
    placeholders: []
    languages:
      en:
        telegram: "For any question about your medicines, food or symptoms, ask your care team."
        email:
          subject: "Your record"
          body: "For any question about your medicines, food or symptoms, ask your care team."
      te:
        # needs native-speaker review
        telegram: "మీ మందులు, ఆహారం లేదా లక్షణాల గురించి ఏ ప్రశ్న ఉన్నా మీ సంరక్షణ బృందాన్ని అడగండి."
        email:
          subject: "మీ రికార్డు"
          body: "మీ మందులు, ఆహారం లేదా లక్షణాల గురించి ఏ ప్రశ్న ఉన్నా మీ సంరక్షణ బృందాన్ని అడగండి."

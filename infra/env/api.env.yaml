# Non-secret env for cm-api (gcloud run deploy --env-vars-file). Secrets come from --set-secrets.
CM_ENV: "demo"
CM_ROLE: "api"
CM_DATA_CLASS: "mock"
CM_SIM: "1"
CM_OFFLINE: "0"
DEMO_MODE: "1"
TZ: "Asia/Kolkata"
LOG_LEVEL: "INFO"
LOG_FORMAT: "json"
GCP_PROJECT: "caremem-hack"
GCP_REGION: "asia-south1"
GCS_DOCS_BUCKET: "caremem-hack-cm-docs"
# Cloud Run mounts the Cloud SQL socket at /cloudsql/<instance>; cm/core/config.py reads DB_HOST.
DB_HOST: "/cloudsql/caremem-hack:asia-south1:cm-pg"
DB_PORT: "5432"
DB_NAME: "caremem"
DB_USER: "cm_app"
DB_POOL_MAX: "5"
# Replace <domain> with the real domain (or run 85_lb.sh / 60_deploy.sh with DOMAIN set: it substitutes).
CM_COOKIE_DOMAIN: ""  # keep EMPTY: host-only cookies isolate doctor. from patient. (DEPLOY_PLAN 1.6)
DEMO_IGNORE_QUIET_HOURS: "0"  # set "1" only for a night demo (CM_ENV=demo honours it)
TASKS_MODE: "cloud"
TASKS_INVOKER_SA: "cm-tasks-invoker@caremem-hack.iam.gserviceaccount.com"
PUBSUB_PUSH_SA_EMAIL: "cm-pubsub-push@caremem-hack.iam.gserviceaccount.com"
GMAIL_PUBSUB_TOPIC: "projects/caremem-hack/topics/gmail-push"
ORCHESTRATOR_MODEL: "deepseek:deepseek-v4-pro"
WORKER_MODEL: "deepseek:deepseek-flash"
VISION_MODEL: "deepseek:deepseek-flash"
EMBEDDING_MODEL: "openai:text-embedding-3-small"
JUDGE_MODEL: "deepseek:deepseek-flash"
LANGSMITH_TRACING: "false"  # set "true" only after LANGSMITH_API_KEY has a value
LANGSMITH_PROJECT: "caremem-prod"
# WORKER_URL is injected by 60_deploy.sh (--update-env-vars).

# --- cloud-readiness (Firebase Hosting + Firebase Auth); names and placeholders only, no secrets ---
AUTH_MODE: "firebase"                 # default is "local"; firebase refuses to start without FIREBASE_PROJECT_ID
FIREBASE_PROJECT_ID: "<firebase-project-id>"  # the Firebase/GCP project id (public, not a secret)
# Hosting origins (bearer token, no cookies). Same-origin rewrites need no CORS; direct <run-url> calls do (SSE, uploads).
CORS_ORIGINS: "https://<site-doctor>.web.app,https://<site-patient>.web.app"
CM_ALLOWED_HOSTS: "<site-doctor>.web.app,<site-patient>.web.app,.run.app"
COOKIE_SECURE: "1"
PUBLIC_BASE_URL: "https://<site-patient>.web.app"
# Telegram webhook (values live in Secret Manager: TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET via --set-secrets)
TELEGRAM_BOT_USERNAME: "<bot-username>"
TELEGRAM_PER_CHAT_RPS: "1"
TELEGRAM_GLOBAL_RPS: "20"
# TELEGRAM_BOT_TOKEN      -> secret (Secret Manager)
# TELEGRAM_WEBHOOK_SECRET -> secret (Secret Manager)
# JWT_SIGNING_KEY, DB_PASSWORD, OPENAI_API_KEY, DEEPSEEK_API_KEY -> secrets (Secret Manager)
UPLOAD_MAX_MB: "10"

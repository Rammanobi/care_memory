# Non-secret env for cm-api (gcloud run deploy --env-vars-file). Secrets come from --set-secrets.
CM_ENV: "demo"
CM_ROLE: "api"
CM_DATA_CLASS: "mock"
CM_SIM: "1"
CM_OFFLINE: "0"
DEMO_MODE: "1"
TZ: "Asia/Kolkata"
LOG_LEVEL: "INFO"
LOG_FORMAT: "json"
GCP_PROJECT: "<project>"
GCP_REGION: "asia-south1"
GCS_DOCS_BUCKET: "<project>-cm-docs"
# Cloud Run mounts the Cloud SQL socket at /cloudsql/<instance>; cm/core/config.py reads DB_HOST.
DB_HOST: "/cloudsql/<project>:asia-south1:cm-pg"
DB_PORT: "5432"
DB_NAME: "caremem"
DB_USER: "cm_app"
DB_POOL_MAX: "5"
# <project>, <doctor-site>, <patient-site> are filled by infra/vars.sh render_env at deploy time.
CM_COOKIE_DOMAIN: ""  # keep EMPTY: host-only cookies isolate doctor. from patient. (DEPLOY_PLAN 1.6)
DEMO_IGNORE_QUIET_HOURS: "0"  # set "1" only for a night demo (CM_ENV=demo honours it)
TASKS_MODE: "cloud"
TASKS_INVOKER_SA: "cm-tasks-invoker@<project>.iam.gserviceaccount.com"
PUBSUB_PUSH_SA_EMAIL: "cm-pubsub-push@<project>.iam.gserviceaccount.com"
GMAIL_PUBSUB_TOPIC: "projects/<project>/topics/gmail-push"
ORCHESTRATOR_MODEL: "deepseek:deepseek-v4-pro"
WORKER_MODEL: "deepseek:deepseek-flash"
VISION_MODEL: "deepseek:deepseek-flash"
EMBEDDING_MODEL: "openai:text-embedding-3-small"
JUDGE_MODEL: "deepseek:deepseek-flash"
LANGSMITH_TRACING: "false"  # set "true" only after LANGSMITH_API_KEY has a value
LANGSMITH_PROJECT: "caremem-prod"
# WORKER_URL and CM_TASKS_BASE_URL (= the cm-worker run.app URL) are appended by 60_deploy.sh (render_env).

# --- cloud-readiness (Firebase Hosting + Firebase Auth); names and placeholders only, no secrets ---
AUTH_MODE: "firebase"                 # default is "local"; firebase refuses to start without FIREBASE_PROJECT_ID
FIREBASE_PROJECT_ID: "<project>"  # the Firebase/GCP project id (public, not a secret)
# Hosting origins (bearer token, no cookies). Same-origin rewrites need no CORS; direct <run-url> calls do (SSE, uploads).
CORS_ORIGINS: "https://<doctor-site>.web.app,https://<doctor-site>.firebaseapp.com,https://<patient-site>.web.app,https://<patient-site>.firebaseapp.com"
# "*.run.app" (with the star): cm/api/web.py host_allowed matches only exact names or "*."-prefixed patterns.
CM_ALLOWED_HOSTS: "<doctor-site>.web.app,<doctor-site>.firebaseapp.com,<patient-site>.web.app,<patient-site>.firebaseapp.com,*.run.app"
COOKIE_SECURE: "1"
PUBLIC_BASE_URL: "https://<patient-site>.web.app"
# Telegram: the cloud bot is DISABLED (owner decision 2026-10-25; infra/vars.sh TELEGRAM_ENABLED=0). No token or
# webhook secret is mounted: outbound Telegram rows fail with error "auth" (never retried) and /webhooks/telegram
# rejects every call (no secret). To enable later: TELEGRAM_ENABLED=1, set TELEGRAM_BOT_USERNAME here, re-run 30/60/90.
TELEGRAM_BOT_USERNAME: ""
TELEGRAM_PER_CHAT_RPS: "1"
TELEGRAM_GLOBAL_RPS: "20"
# JWT_SIGNING_KEY, DB_PASSWORD, OPENAI_API_KEY, DEEPSEEK_API_KEY -> secrets (Secret Manager)
UPLOAD_MAX_MB: "10"

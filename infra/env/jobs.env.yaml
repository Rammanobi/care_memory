# Non-secret env for Cloud Run Jobs (cm-migrate, cm-nightly, cm-sweeper, cm-seed, cm-eval).
# CM_JOB, WORKER_URL and CM_TASKS_BASE_URL are appended per job by 60_deploy.sh (render_env).
CM_ENV: "demo"
CM_ROLE: "job"
CM_DATA_CLASS: "mock"
CM_SIM: "1"
CM_OFFLINE: "0"
DEMO_MODE: "1"
TZ: "Asia/Kolkata"
LOG_LEVEL: "INFO"
LOG_FORMAT: "json"
GCP_PROJECT: "<project>"
GCP_REGION: "asia-south1"
GCS_DOCS_BUCKET: "<project>-cm-docs"
# Cloud Run mounts the Cloud SQL socket at /cloudsql/<instance>; cm/core/config.py reads DB_HOST.
DB_HOST: "/cloudsql/<project>:asia-south1:cm-pg"
DB_PORT: "5432"
DB_NAME: "caremem"
# Jobs run as cm_admin (migrations); password mapped from DB_PASSWORD_ADMIN in 60_deploy.sh.
DB_USER: "cm_admin"
DB_POOL_MAX: "10"
TASKS_MODE: "cloud"
TASKS_INVOKER_SA: "cm-tasks-invoker@<project>.iam.gserviceaccount.com"
ORCHESTRATOR_MODEL: "deepseek:deepseek-v4-pro"
WORKER_MODEL: "deepseek:deepseek-flash"
VISION_MODEL: "deepseek:deepseek-flash"
EMBEDDING_MODEL: "openai:text-embedding-3-small"
JUDGE_MODEL: "deepseek:deepseek-flash"
LANGSMITH_TRACING: "false"  # set "true" only after LANGSMITH_API_KEY has a value
LANGSMITH_PROJECT: "caremem-prod"

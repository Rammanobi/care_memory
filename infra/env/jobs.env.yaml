# Non-secret env for Cloud Run Jobs (cm-migrate, cm-nightly, cm-sweeper, cm-seed, cm-eval).
# CM_JOB and WORKER_URL are set per job by 60_deploy.sh.
CM_ENV: "demo"
CM_ROLE: "job"
CM_DATA_CLASS: "mock"
CM_SIM: "1"
CM_OFFLINE: "0"
DEMO_MODE: "1"
TZ: "Asia/Kolkata"
LOG_LEVEL: "INFO"
LOG_FORMAT: "json"
GCP_PROJECT: "caremem-hack"
GCP_REGION: "asia-south1"
GCS_DOCS_BUCKET: "caremem-hack-cm-docs"
DB_CONNECT_MODE: "socket"
CLOUD_SQL_INSTANCE: "caremem-hack:asia-south1:cm-pg"
DB_NAME: "caremem"
DB_USER_ENGINE: "cm_engine"
DB_USER_ADMIN: "cm_admin"
DB_POOL_MAX: "10"
TASKS_MODE: "cloud"
TASKS_INVOKER_SA: "cm-tasks-invoker@caremem-hack.iam.gserviceaccount.com"
ORCHESTRATOR_MODEL: "openai:<flagship-model>"
WORKER_MODEL: "deepseek:deepseek-chat"
VISION_MODEL: "openai:<vision-model>"
EMBEDDING_MODEL: "openai:text-embedding-3-small"
LANGSMITH_TRACING: "true"
LANGSMITH_PROJECT: "caremem-prod"

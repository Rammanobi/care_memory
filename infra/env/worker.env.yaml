# Non-secret env for cm-worker. Secrets come from --set-secrets.
CM_ENV: "demo"
CM_ROLE: "worker"
CM_DATA_CLASS: "mock"
CM_SIM: "1"
CM_OFFLINE: "0"
DEMO_MODE: "1"
TZ: "Asia/Kolkata"
LOG_LEVEL: "INFO"
LOG_FORMAT: "json"
GCP_PROJECT: "<project>"
GCP_REGION: "asia-south1"
GCS_DOCS_BUCKET: "<project>-cm-docs"
# Cloud Run mounts the Cloud SQL socket at /cloudsql/<instance>; cm/core/config.py reads DB_HOST.
DB_HOST: "/cloudsql/<project>:asia-south1:cm-pg"
DB_PORT: "5432"
DB_NAME: "caremem"
DB_USER: "cm_app"
DB_POOL_MAX: "4"
DEMO_IGNORE_QUIET_HOURS: "0"  # worker sends the reminders: set "1" here too for a night demo
PUBLIC_BASE_URL: "https://<patient-site>.web.app"  # stage 1: no custom domain
# WORKER_URL and CM_TASKS_BASE_URL (= this service's own run.app URL) are set by 60_deploy.sh after deploy.
TASKS_MODE: "cloud"
TASKS_INVOKER_SA: "cm-tasks-invoker@<project>.iam.gserviceaccount.com"
GMAIL_PUBSUB_TOPIC: "projects/<project>/topics/gmail-push"
ORCHESTRATOR_MODEL: "deepseek:deepseek-v4-pro"
WORKER_MODEL: "deepseek:deepseek-flash"
VISION_MODEL: "deepseek:deepseek-flash"
EMBEDDING_MODEL: "openai:text-embedding-3-small"
JUDGE_MODEL: "deepseek:deepseek-flash"
LANGSMITH_TRACING: "false"  # set "true" only after LANGSMITH_API_KEY has a value
LANGSMITH_PROJECT: "caremem-prod"
